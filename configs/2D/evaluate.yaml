# 二维参数边界评估配置
# 完整命令行说明：configs/2D/evaluate_cli.md
# 命令行参数会覆盖本文件中的对应值。
#
# case 字段：
#   boundary_type：边界生成器名称。
#   split：interpolation（内插）或 extrapolation（外推）。
#   parameter / values：变化参数及测试值。
#   train_grid：模型训练时的边界输入网格规模。
#   grid_shapes：需要生成和评估的输出网格规模。
#   fixed_parameters：本 case 中保持不变的几何参数。

# =============================================================================
# 评估案例（按数据集名称排序）
# =============================================================================

cases:
  air_t_ext_0_1000_21_20:
    boundary_type: circle_airfoil_t
    split: extrapolation
    parameter: t
    values: [0.62, 0.65]
    train_grid: [21, 20]
    grid_shapes: [[21, 20], [51, 50], [101, 100]]
    fixed_parameters:
      radius: 1.0
      m: 0.02
      p: 0.4
      c: 1.0
      center: [0.0, 0.0]

  air_t_ext_0_1000_41_20:
    boundary_type: circle_airfoil_t
    split: extrapolation
    parameter: t
    values: [0.62, 0.65]
    train_grid: [41, 20]
    grid_shapes: [[41, 20], [51, 50], [101, 100]]
    fixed_parameters:
      radius: 1.0
      m: 0.02
      p: 0.4
      c: 1.0
      center: [0.0, 0.0]

  air_t_int_0_1000_21_20:
    boundary_type: circle_airfoil_t
    split: interpolation
    parameter: t
    values: [0.275, 0.3, 0.325]
    train_grid: [21, 20]
    grid_shapes: [[21, 20], [51, 50], [101, 100]]
    fixed_parameters:
      radius: 1.0
      m: 0.02
      p: 0.4
      c: 1.0
      center: [0.0, 0.0]

  air_t_int_0_1000_41_20:
    boundary_type: circle_airfoil_t
    split: interpolation
    parameter: t
    values: [0.275, 0.3, 0.325]
    train_grid: [41, 20]
    grid_shapes: [[41, 20], [51, 50], [101, 100]]
    fixed_parameters:
      radius: 1.0
      m: 0.02
      p: 0.4
      c: 1.0
      center: [0.0, 0.0]

  esa_ext_0_1000_20_20:
    boundary_type: eccentric_semiannulus
    split: extrapolation
    parameter: inner_center_x
    values: [0.72, 0.75]
    train_grid: [20, 20]
    grid_shapes: [[20, 20], [50, 50], [100, 100]]
    fixed_parameters:
      outer_radius: 0.5
      inner_radius: 0.1

  esa_int_0_1000_20_20:
    boundary_type: eccentric_semiannulus
    split: interpolation
    parameter: inner_center_x
    values: [0.475, 0.5, 0.525]
    train_grid: [20, 20]
    grid_shapes: [[20, 20], [50, 50], [100, 100]]
    fixed_parameters:
      outer_radius: 0.5
      inner_radius: 0.1

  gsp_ext_0_1000_81_81:
    boundary_type: gear_spline
    split: extrapolation
    parameter: amplitude
    values: [0.2, 0.22, 0.24]
    train_grid: [81, 81]
    grid_shapes: [[81, 81], [121, 121], [161, 161]]
    fixed_parameters:
      width: 2.0
      height: 1.6
      teeth: 6
      controls_per_wave: 16

  gsp_int_0_1000_81_81:
    boundary_type: gear_spline
    split: interpolation
    parameter: amplitude
    values: [0.1125, 0.125, 0.1375]
    train_grid: [81, 81]
    grid_shapes: [[81, 81], [121, 121], [161, 161]]
    fixed_parameters:
      width: 2.0
      height: 1.6
      teeth: 6
