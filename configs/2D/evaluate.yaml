      length: 4.0
      height: 0.8
      bend: 2.0

  vsc_int_0_1000_41_41:
    boundary_type: variable_width_s_channel
    split: interpolation
    parameter: constriction
    values: [0.375, 0.45, 0.525]
    train_grid: [41, 41]
    grid_shapes: [[41, 41], [81, 81], [121, 121]]
    fixed_parameters:
      length: 4.0
      height: 0.8
      bend: 2.0
# =============================================================================
# 评估方法与模型
# =============================================================================

evaluation:
  attentionpihmonet_mapping_mode: current
  # 默认评估方法。可选任意组合：
  # tfi、pde、meshonet、pimeshonet、hmonet、pihmonet。
  methods: [tfi, pde, meshonet, hmonet]

  # 不指定 --case 时评估这些案例。
  default_cases: [air_t_int_0_1000_41_20, air_t_ext_0_1000_41_20]

  # HMONet/PI-HMONet 内部映射：current、coons_residual、both。
  hmonet_mapping_mode: current
  pihmonet_mapping_mode: current

  # 边界后处理：none、direct、inverse_distance。
  hmonet_boundary_projection: none
  meshonet_boundary_projection: none
  pimeshonet_boundary_projection: none
  pihmonet_boundary_projection: none
  attentionpihmonet_boundary_projection: none
  inverse_distance_power: 2.0

  # null 自动查找对应数据集和模型设置下最新的兼容 checkpoint。
  hmonet_checkpoint: null
  meshonet_checkpoint: null
  pimeshonet_checkpoint: null
  pihmonet_checkpoint: null
  attentionpihmonet_checkpoint: null
  skip_missing_checkpoints: true


  # ---------------------------------------------------------------------------
  # 推理与计时
  # ---------------------------------------------------------------------------

  # auto 优先使用可用 CUDA；也可设置 cpu、cuda、cuda:0。
  device: auto
  query_batch_size: 50000
  inference_batch_size: 1

  # 曲线求值后端：auto（优先融合内核）或 torch。
  curve_kernel_backend: auto

  # 预热不计时；测量结果去掉一个最大值和一个最小值后取平均。
  inference_warmup_runs: 3
  inference_timing_repeats: 10


  # ---------------------------------------------------------------------------
  # PDE
  # ---------------------------------------------------------------------------

  winslow_max_iter: 1000
  winslow_tolerance: 1.0e-8
  require_pde_convergence: true

  # 使用 HMONet 结果继续进行 Winslow 迭代；0 表示关闭。
  hmonet_pde_iterations: 0


  # ---------------------------------------------------------------------------
  # 网格质量
  # ---------------------------------------------------------------------------

  # false 时只保存网格、计时和边界误差。
  compute_grid_quality: true

  # both/all：全部指标；none：不计算；也可写列表，如
  # [min_angle, scaled_jacobian, intersecting_cell]。
  quality_metrics: both

  # 如需关闭单项，可取消下面注释，或使用 --no-quality-<指标名>。
  # quality_switches:
  #   intersecting_cell: false
  #   self_intersection: false

  save_plots: true
  save_png: true
  save_pdf: false
  save_distribution_plots: false


  # ---------------------------------------------------------------------------
  # 输出、缓存与局部图
  # ---------------------------------------------------------------------------

  output_root: outputs/results
  reuse_generated_results: true
  reuse_analysis_results: true

  # 命令行执行模式：
  # --force：重新生成网格并重新分析；
  # --force-regenerate / --force-reanalyze：仅重做对应阶段；
  # --generation-only / --analysis-only：只运行一个阶段。

  # 局部图可指定物理坐标矩形，也可自动定位某项质量的最差单元。
  zoom_views: []
  # - {metric: intersecting_cell, center_on: worst, cell_padding: 2}
  # - {metric: scaled_jacobian, xlim: [-0.55, 0.55], ylim: [-0.25, 0.25]}
