  rse_int_0_1000_20_20:
    boundary_type: rect_top_semiellipse
    split: interpolation
    parameter: semi_minor_axis
    values: [0.225, 0.25, 0.275]
    train_grid: [20, 20]
    grid_shapes: [[20, 20], [50, 50], [100, 100]]
    fixed_parameters:
      length: 1.0
      height: 1.0

  run_ext_0_1000_61_21:
    boundary_type: rounded_u_notch
    split: extrapolation
    parameter: depth
    values: [1.52, 1.535, 1.55]
    train_grid: [61, 21]
