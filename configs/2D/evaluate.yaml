# 二维参数边界评估配置。命令行覆盖本文件的同名项目。
# 数据集生成命令见 data/2D/generation_commands.md。

# 当前正式二维数据集统一采用 v1/500 与 41x41 训练网格。
cases:
  # 兼容已有的 21x21 训练结果；不作为当前正式默认数据集。
  air_t_ext_1_500_21_21:
    boundary_type: circle_airfoil_t
    split: extrapolation
    parameter: t
    values: [0.62, 0.65]
    train_grid: [21, 21]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {radius: 1.0, m: 0.02, p: 0.4, c: 1.0, center: [0.0, 0.0]}
  air_t_ext_1_500_41_41:
    boundary_type: circle_airfoil_t
    split: extrapolation
    parameter: t
    values: [0.62, 0.65]
    train_grid: [41, 41]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {radius: 1.0, m: 0.02, p: 0.4, c: 1.0, center: [0.0, 0.0]}
  esa_ext_1_500_41_41:
    boundary_type: eccentric_semiannulus
    split: extrapolation
    parameter: inner_center_x
    values: [0.72, 0.75]
    train_grid: [41, 41]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {outer_radius: 0.5, inner_radius: 0.1}
  rse_ext_1_500_41_41:
    boundary_type: rect_top_semiellipse
    split: extrapolation
    parameter: semi_minor_axis
    values: [0.42, 0.46, 0.50, 0.55, 0.60]
    train_grid: [41, 41]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {length: 1.0, height: 1.0}
  run_ext_1_500_41_41:
    boundary_type: rounded_u_notch
    split: extrapolation
    parameter: depth
    values: [1.52, 1.55]
    train_grid: [41, 41]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {width: 3.0, height: 2.0, notch_width: 0.9, radius: 0.25}
  scc_ext_1_500_41_41:
    boundary_type: smooth_constricted_channel
    split: extrapolation
    parameter: depth
    values: [0.42, 0.45, 0.47]
    train_grid: [41, 41]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {length: 3.0, height: 1.0}
  vsc_ext_1_500_41_41:
    boundary_type: variable_width_s_channel
    split: extrapolation
    parameter: constriction
    values: [0.85, 0.90, 0.95]
    train_grid: [41, 41]
    grid_shapes: [[101, 101], [201, 201], [401, 401]]
    fixed_parameters: {length: 4.0, height: 0.8, bend: 2.0}

evaluation:
  default_cases: [air_t_ext_1_500_41_41, esa_ext_1_500_41_41, rse_ext_1_500_41_41, run_ext_1_500_41_41, scc_ext_1_500_41_41, vsc_ext_1_500_41_41]
  methods: [tfi, pde, meshonet, pimeshonet, hmonet, qghmonet]
  # CCAP = Corner-Corrected Affine Projection（角点校正仿射投影）。
  # 另可选 RAP = rational_affine，CR = coons_residual。
  hmonet_mapping_mode: CCAP
  # none = no external boundary postprocessing; the unmodified model output
  # is stored once in each method's raw/ directory.
  hmonet_boundary_projection: none
  qghmonet_boundary_projection: none
  meshonet_boundary_projection: none
  pimeshonet_boundary_projection: none
  inverse_distance_power: 2.0
  hmonet_checkpoint: null
  qghmonet_checkpoint: null
  meshonet_checkpoint: null
  pimeshonet_checkpoint: null
  skip_missing_checkpoints: true
  device: auto
  query_batch_size: 50000
  inference_batch_size: 1
  curve_kernel_backend: auto
  inference_warmup_runs: 3
  inference_timing_repeats: 10
  winslow_max_iter: 1000
  winslow_tolerance: 1.0e-8
  require_pde_convergence: true
  hmonet_pde_iterations: 0
  compute_grid_quality: true
  quality_metrics: both
  quality_plot_metrics: []
  save_plots: true
  save_png: true
  compact_outputs: true
  save_pdf: false
  save_distribution_plots: false
  output_root: outputs/results
  reuse_generated_results: true
  reuse_analysis_results: true
  zoom_views: []
