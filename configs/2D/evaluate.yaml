  tri_int_0_1000_21_20:
    boundary_type: symmetric_convex_tri
    split: interpolation
    parameter: protrusion_distance
    values: [0.225, 0.25, 0.275]
    train_grid: [21, 20]
    grid_shapes: [[21, 20], [51, 50], [101, 100]]
    fixed_parameters:
      width: 1.0
      side_length: 1.0

  vsb_ext_0_1000_41_41:
    boundary_type: variable_width_s_channel
    split: extrapolation
    parameter: bend
    values: [3.25, 3.5, 4.0]
    train_grid: [41, 41]
    grid_shapes: [[41, 41], [81, 81], [121, 121]]
    fixed_parameters:
      length: 4.0
