# 首轮训练开始前保存的本次实际生效参数。
datasets:
  extrapolation: E:\projects\HMONet\data\raw\2D\run_ext_1_500_41_41
grid:
  nx: 41
  ny: 41
model:
  name: hmonet
  common:
    branch_dim: 32
    trunk_dim: 18
    coordinate_lift_mode: legacy
    adjust_hidden_dim: 64
    adjust_hidden_layer_num: 4
    branch_hidden_dim: 64
    branch_hidden_layer_num: 4
    trunk_hidden_dim: 64
    trunk_hidden_layer_num: 4
    output_dim: 64
    branch_mlp_hidden_dim: 64
    branch_mlp_hidden_layer_num: 4
  hmonet:
    hmonet_mapping_mode: CCAP
    boundary_self_attention_enabled: false
    weight_head_mlp_enabled: true
    projection_mlp_hidden_dim: 64
    attention_dim: 64
    attention_heads: 4
    attention_layers: 2
    attention_feedforward_dim: 128
    attention_dropout: 0.0
    residual_regularization_weight: 0.0
training:
  dataset: extrapolation
  num_epochs: 100000
  batch_size: 64
  seed: 20261030
  device: cuda
  tensorboard_enabled: true
  best_model_metric: training_loss
  calculate_dataset_mse: true
  dataset_mse_interval: 1
  check_mse_convergence: false
  mse_tolerance: 1.0e-06
  mse_consecutive_epochs: 100
  check_training_loss_convergence: false
  training_loss_tolerance: 1.0e-06
  training_loss_consecutive_epochs: 100
  plateau_enabled: true
  plateau_metric: train_loss
  plateau_window: 500
  fluctuation_quantiles:
  - 0.1
  - 0.9
  fluctuation_relative_tolerance: 0.15
  fluctuation_absolute_minimum: 1.0e-06
  fluctuation_absolute_maximum: 1.0e-05
  plateau_near_best_relative_tolerance: 0.2
  plateau_near_best_absolute_tolerance: 1.0e-07
  best_improvement_relative_tolerance: 0.002
  convergence_start_epoch: 3000
  success_plateau_patience: 1000
  plateau_stable_consecutive_checks: 100
  plateau_log_interval: 100
  plateau_fluctuation_spread_enabled: true
  plateau_fluctuation_spread_activation: 0.4
  plateau_fluctuation_spread_start_epoch: 1000
  plateau_fluctuation_spread_activation_epoch: 5000
  plateau_fluctuation_spread_window: 1000
  plateau_fluctuation_spread_quantiles:
  - 0.1
  - 0.9
  plateau_fluctuation_spread_tolerance: 0.15
  failure_plateau_enabled: true
  failure_plateau_patience: 2000
  failure_plateau_metric_ratio: 1.5
  failure_plateau_relative_fluctuation: 0.15
  failure_plateau_min_lr_updates: 2
  save_best_immediately: true
  stop_file_enabled: true
  gradient_clip_norm: 1.0
  skip_nonfinite_loss: true
  check_plateau_stability: false
  check_plateau_absolute_stability: false
  check_plateau_near_best: false
  check_plateau_consecutive_stability: false
  check_plateau_best_improvement: false
  active_phase: random_loss_combo
  phase_transitions:
  - phase: random_loss_combo
    start_epoch: 1
hmonet_training:
  best_model_metric: training_loss
  plateau_metric: train_loss
  learning_rate: 0.0004
  lr_warmup_epochs: 1000
  lr_update_interval: 1000
  lr_decay_gamma: 0.9
  lr_stop_below: 1.0e-05
  training_strategy: random_loss_combo_from_start
  random_loss_sample_count: 400
  pde_fd_step:
  - 0.01
  - 0.01
  jacobian_fd_step: 0.01
  random_loss_derivative_backend: finite_difference
  random_loss_fd_stencil_inside: true
  random_loss_fd_boundary_scheme: central
  random_mse_loss_weight: 0.0
  physics_pde_loss_weight: 1.0
  physics_scale_invariant_pde_enabled: true
  physics_normalized_jacobian_loss_weight: 0.0
  physics_normalized_jacobian_minimum: 0.02
  physics_singular_value_loss_weight: 0.0
  physics_singular_value_minimum: 0.05
  physics_barrier_reduction: all
  random_loss_sampling_mode: uniform
  random_loss_global_sample_count: 400
  random_loss_curvature_sample_count: 0
  random_loss_boundary_band_sample_count: 0
  check_plateau_stability: false
  check_plateau_absolute_stability: false
  check_plateau_near_best: false
  check_plateau_consecutive_stability: false
  check_plateau_best_improvement: false
  jacobian_method: finite_difference
  tfi_warmup_epochs: 5000
  phase1_max_epochs: 100000
  phase2_max_epochs: 100000
  save_phase_best_checkpoints: false
  physics_jacobian_enabled: false
  physics_jacobian_minimum: 0.001
  physics_interior_sample_count: 128
  fixed_mse_sample_count: 400
hmonet_sampling:
  mode: uniform
  fixed_grid_count: 0
  global_random_count: 400
  curvature_adaptive_count: 0
  candidate_multiplier: 10
  curvature_quantile: 0.95
  curvature_power: 1.0
  distance_sigma_min: 0.02
  distance_sigma_max: 0.1
  uniform_probability: 0.05
