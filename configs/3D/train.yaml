# 三维训练配置。公共参数的默认值、排列顺序和注释与二维 train.yaml 保持一致。

datasets:  # 数据集路径配置
  extrapolation: data/raw/3D/sch_r_ext_0_1000_11_31_11  # 外推训练数据集路径
  interpolation: data/raw/3D/sch_r_int_0_1000_11_31_11  # 内插训练数据集路径

grid:  # 三维训练网格尺寸
  nx: 11  # xi径向节点数：内圆到外部操场形边界
  ny: 31  # eta周向节点数：内圆和外边界使用相同采样数
  nz: 11  # zeta方向节点数

model:  # 模型与网络结构配置；支持五个单模型、both、pi和all
  name: both  # 默认分别训练HMONet和MeshONet
  common:  # 五种模型共用的网络结构
    branch_dim: 64  # 边界分支特征维度
    trunk_dim: 24  # 坐标主干特征维度
    adjust_hidden_dim: 128  # 边界调整网络隐藏层宽度
    branch_hidden_dim: 128  # 边界分支隐藏层宽度
    trunk_hidden_dim: 128  # 坐标主干隐藏层宽度
    adjust_hidden_layer_num: 4  # 边界调整网络隐藏层数
    branch_hidden_layer_num: 4  # 边界分支隐藏层数
    trunk_hidden_layer_num: 4  # 坐标主干隐藏层数
    output_dim: 128  # 融合特征维度
  pimeshonet:  # 论文PI-MeshONet网络结构
    architecture: paper_modified_mlp  # 三坐标分支与共享Lift/Modified MLP主干
    branch_dim: 64  # Adjust Layer输出维度
    trunk_dim: 24  # 三维Lift Layer输出维度
    adjust_hidden_dim: 128  # Adjust Layer隐藏宽度
    adjust_hidden_layer_num: 4  # Adjust Layer隐藏层数
    branch_hidden_dim: 128  # Modified MLP分支隐藏宽度
    branch_hidden_layer_num: 4  # Modified MLP分支门控层数
    trunk_hidden_dim: 128  # Modified MLP主干隐藏宽度
    trunk_hidden_layer_num: 4  # Modified MLP主干门控层数
    output_dim: 128  # 分支与主干点积的潜在维度
  pihmonet:  # PI-HMONet模型覆盖配置
    hmonet_mapping_mode: current  # HMONet内部映射方式
  attentionpihmonet:  # Attention-PI-HMONet模型覆盖配置
    hmonet_mapping_mode: current  # 边界精确投影方式：current或coons_residual
    attention_dim: 64  # 边界自注意力特征维度
    attention_heads: 4  # 多头注意力头数
    attention_layers: 2  # 自注意力编码层数
    attention_feedforward_dim: 128  # 注意力层前馈网络宽度
    attention_dropout: 0.0  # 注意力层dropout比例
  hmonet:  # HMONet模型配置
    hmonet_mapping_mode: current  # 内部硬边界映射：current或coons_residual
    trunk_projection_coefficients_enabled: false  # 是否由主干MLP输出位置相关系数并与分支系数逐位相乘；HMONet基线默认关闭
    projection_softplus_enabled: false  # true使用Softplus，false使用Sigmoid；HMONet基线默认关闭Softplus
    boundary_self_attention_enabled: false  # 是否在边界编码器前启用联合自注意力；HMONet基线默认关闭
    projection_mlp_hidden_dim: 64  # 主干几何系数MLP隐藏层宽度
    attention_dim: 64  # 边界自注意力特征维度
    attention_heads: 4  # 多头注意力头数
    attention_layers: 2  # 自注意力编码层数
    attention_feedforward_dim: 128  # 注意力层前馈网络宽度
    attention_dropout: 0.0  # 注意力层dropout比例
    residual_regularization_weight: 0.0  # 仅coons_residual使用；0表示关闭

  meshonet:  # 论文式三分支共享融合结构；32x32x32时参数量为154163
    branch_dim: 24  # Adjust Layer输出维度
    trunk_dim: 24  # 三维坐标增强后的主干输入维度
    adjust_hidden_dim: 8  # Adjust Layer隐藏宽度
    adjust_hidden_layer_num: 4  # Adjust Layer隐藏层数
    branch_hidden_dim: 20  # Branch网络隐藏宽度
    branch_hidden_layer_num: 4  # Branch网络隐藏层数
    trunk_hidden_dim: 20  # Trunk网络隐藏宽度
    trunk_hidden_layer_num: 4  # Trunk网络隐藏层数
    output_dim: 24  # 分支和主干点积的潜在维度
    shared_branch_fusion_enabled: true  # 三个分支拼接后是否使用共享融合MLP
    branch_mlp_hidden_dim: 24  # 共享融合MLP隐藏宽度
    branch_mlp_hidden_layer_num: 3  # 共享融合MLP隐藏层数

training:  # 公共训练设置
  dataset: both  # 训练数据模式
  num_epochs: 50000  # 最大训练轮数
  # 监督模型默认使用固定网格MSE；PI模型会强制改为自监督训练损失。
  best_model_metric: dataset_mse  # HMONet和MeshONet的最佳模型选择指标
  tensorboard_enabled: true  # 是否启用TensorBoard
  batch_size: 64  # 批大小
  seed: 20261002  # 随机种子
  device: cuda  # 训练设备
  sample_count: 400  # 三维每批共享随机采样点数
  log_interval: 100  # 训练日志输出间隔
  # [收敛条件1] 固定网格 MSE：监测固定网格误差，可选作为停止条件。
  calculate_dataset_mse: true  # 是否计算固定网格MSE
  dataset_mse_interval: 1  # 固定网格MSE计算间隔
  check_mse_convergence: false  # 是否启用固定网格MSE连续达标的提前停止，默认关闭
  mse_tolerance: 1.0e-6  # MSE收敛阈值
  mse_consecutive_epochs: 100  # MSE连续满足次数

  # [收敛条件2] 训练损失：连续低于阈值时提前停止。
  check_training_loss_convergence: false  # 是否启用训练损失连续达标的提前停止，默认关闭
  training_loss_tolerance: 1.0e-6  # 训练损失收敛阈值
  training_loss_consecutive_epochs: 100  # 训练损失连续满足次数

  # [收敛条件3] 统一成功平台：达到最早epoch后，近最佳、稳定且长期无显著改善时停止。
  plateau_enabled: true  # 是否启用平台收敛判断
  # PI模型会强制使用train_loss，保持自监督训练。
  plateau_metric: mse  # HMONet和MeshONet的平台判断指标
  plateau_window: 500  # 平台统计窗口长度
  fluctuation_quantiles: [0.1, 0.9]  # 窗口波动分位数
  fluctuation_relative_tolerance: 0.15  # 相对波动容差
  fluctuation_absolute_minimum: 1.0e-6  # 绝对波动下限
  fluctuation_absolute_maximum: 1.0e-5  # 绝对波动上限
  plateau_near_best_relative_tolerance: 0.2  # 接近最佳的相对容差
  plateau_near_best_absolute_tolerance: 1.0e-7  # 接近最佳的绝对容差
  best_improvement_relative_tolerance: 0.005  # 显著改善相对阈值

  convergence_start_epoch: 3000  # 所有自动收敛和失败判定开始检查并累计耐心的最早epoch
  success_plateau_patience: 1000  # 无显著改善耐心；只在出现显著改善时归零
  plateau_stable_consecutive_checks: 100  # 短窗口连续稳定次数；满足后可走短窗口收敛分支
  plateau_log_interval: 100  # 平台日志间隔

  # [收敛条件4] 双分支平台：长期波动稳定或短窗口连续稳定，任一分支可触发停止。
  # 第1000轮后允许按相对波动阈值启动，第5000轮强制启动，并要求收集满整个独立窗口。
  plateau_fluctuation_spread_enabled: true  # 是否启用长期波动收敛分支；与短窗口分支为或关系
  plateau_fluctuation_spread_activation: 0.4  # 第1000轮后，相对波动低于此值时启动长期记录
  plateau_fluctuation_spread_start_epoch: 1000  # 允许启动长期记录的最早epoch
  plateau_fluctuation_spread_activation_epoch: 5000  # 无论相对波动大小均强制启动的epoch
  plateau_fluctuation_spread_window: 1000  # 独立设置的长期波动窗口，默认与无显著改善耐心相同
  plateau_fluctuation_spread_quantiles: [0.1, 0.9]  # 计算长期波动差值的低、高分位数
  plateau_fluctuation_spread_tolerance: 0.15  # 高分位数减低分位数的最大允许差值

  # [收敛条件5] 失败平台：与成功判定共用窗口，稳定但明显劣于历史最佳时停止。
  # 它不把失败运行判为正常收敛；保存和评估仍使用训练过程中即时保存的最佳模型。
  failure_plateau_enabled: true  # 是否启用失败平台提前停止
  failure_plateau_patience: 2000  # 连续满足失败平台条件的检查次数；任一条件失败时归零
  failure_plateau_metric_ratio: 1.5  # 近期中位数相对历史最佳窗口中位数的最小失败倍数
  failure_plateau_relative_fluctuation: 0.15  # 失败平台仍需满足的最大相对波动
  failure_plateau_min_lr_updates: 2  # 判断前至少完成的学习率调度次数
  save_best_immediately: true  # 每次刷新最佳指标时立即原子保存最佳模型
  stop_file_enabled: true  # 是否允许在训练或checkpoint目录放置STOP文件安全停止


  # [数值稳定性] 梯度裁剪与非有限值处理。
  gradient_clip_norm: 1.0  # 梯度裁剪上限
  skip_nonfinite_loss: true  # 是否跳过非有限损失

hmonet_training:
  learning_rate: 0.0002  # 初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限
  # curved_boundary_cell将六个参数面网格双向三等分，删除原始面节点后用全局IDW修正三线性目标。
  target_interpolation: curved_boundary_cell  # 训练目标插值方式：bilinear或curved_boundary_cell
  idw_neighbors: -1  # IDW邻居数：-1使用全部参数面支持点；设为32启用局部K近邻IDW
  idw_query_chunk_size: 512  # IDW查询点分块；默认可一次覆盖当前400个训练采样点
  idw_support_chunk_size: 2048  # IDW参数面支持点分块；11立方网格约需3次大张量累计
  jacobian_loss_enabled: true  # 是否启用Jacobian损失
  jacobian_method: finite_difference  # Jacobian计算方法
  jacobian_fd_step: 0.0001  # 有限差分步长
  jacobian_loss_weight: 0.01  # Jacobian损失权重
  jacobian_minimum: 1.0e-4  # 最小允许Jacobian
  point_loss_weighting: position  # 采样点损失权重：position为边界增强，uniform为全1
  boundary_normal_loss_enabled: false  # 是否启用边界法向损失
  boundary_normal_loss_weight: 0.01  # 边界法向损失权重
  boundary_normal_sample_count: 64  # 法向采样点数
  boundary_normal_offset: 0.01  # 法向内部偏移

meshonet_training:
  learning_rate: 0.0004  # 初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限
  alpha: 1.0  # 内部坐标损失权重
  beta: 5.0  # 边界坐标损失权重
  interior_sample_count: 400  # 每批共享内部采样点数

pimeshonet_training:
  learning_rate: 0.0004  # 初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限
  pde_loss_weight: 1.0e-4  # 原始PDE损失权重
  boundary_loss_weight: 1.0
  interior_sample_count: 128  # 每批共享内部采样点数
  fd_step: null  # 有限差分步长配置

pihmonet_training:
  learning_rate: 0.0004  # 初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限

  pde_loss_weight: 0.0  # 原始PDE损失权重
  normalized_pde_loss_weight: 1.0  # 归一化PDE损失权重

  jacobian_loss_enabled: true  # 是否启用Jacobian损失
  jacobian_loss_weight: 0.1  # Jacobian损失权重
  jacobian_minimum: 1.0e-4  # 最小允许Jacobian

  anchor_loss_weight: 0.01  # TFI锚点损失权重
  anchor_decay_end_epoch: 1000  # 锚点权重衰减结束epoch
  anchor_points_per_axis: 3  # 每轴锚点数量
  anchor_margin: 0.2  # 锚点边界余量

  smoothness_loss_weight: 0.0  # 网格线平滑损失权重
  orthogonality_loss_weight: 0.0  # 正交性损失权重

  interior_sample_count: 128  # 每批共享内部采样点数
  fd_step: null  # 有限差分步长配置

attentionpihmonet_training:  # 带曲面自注意力和精确投影的自监督模型训练参数
  learning_rate: 0.0004  # Adam初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率乘法衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止继续衰减的下限

  pde_backend: finite_difference  # 内部和边界层求导方式：finite_difference（默认）或autograd
  interior_sample_count: 24  # 每批共享的内部物理配点数
  interior_margin: 0.0  # 仅自动微分使用；0表示在整个开计算域内均匀采样
  fd_step: null  # 有限差分后端步长；null时使用数据集逻辑网格步长

  normalized_pde_loss_weight: 1.0  # 内部归一化PDE残差权重
  jacobian_loss_weight: 0.01  # 内部Jacobian合法性损失权重
  jacobian_minimum: 1.0e-4  # Jacobian行列式最低目标值
  smoothness_loss_weight: 1.0e-4  # 内部二阶导平滑损失权重

  boundary_pde_loss_weight: 1.0  # 边界层归一化PDE残差权重；求导方式与pde_backend一致
  boundary_jacobian_loss_weight: 0.01  # 边界层Jacobian损失权重；求导方式与pde_backend一致
  boundary_physics_sample_count: 48  # 六个面合计的边界物理配点数
  boundary_physics_offset: 0.01  # 仅自动微分使用的边界层向内偏移
  boundary_physics_tangential_margin: 0.05  # 仅自动微分使用的棱边和角点避让宽度

  anchor_loss_weight: 0.0  # TFI锚点初始权重；0表示不计算锚点损失
  anchor_decay_end_epoch: 1000  # 锚点权重线性衰减为0的epoch
  anchor_points_per_axis: 3  # 每个计算域方向的固定锚点数
  anchor_margin: 0.2  # 锚点距计算域边界的参数余量

  # 顺序为x_min、x_max、y_min、y_max、z_min、z_max；null时按数据集网格采样。
  boundary_sample_counts: null  # 六个参数面的注意力编码采样规模








