# 三维训练配置。公共参数的默认值、排列顺序和注释与二维 train.yaml 保持一致。

datasets:  # 数据集路径配置
  extrapolation: data/raw/3D/sch_r_ext_0_1000_11_31_11  # 外推训练数据集路径
  interpolation: data/raw/3D/sch_r_int_0_1000_11_31_11  # 内插训练数据集路径

grid:  # 三维训练网格尺寸
  nx: 11  # xi径向节点数：内圆到外部操场形边界
  ny: 31  # eta周向节点数：内圆和外边界使用相同采样数
  nz: 11  # zeta方向节点数

model:  # 支持单模型、逗号分隔的任意模型组合，以及both、pi、all快捷别名
  name: hmonet  # 与二维正式配置一致，默认训练HMONet
  common:  # 正式实验采用与二维ex7基线一致的精简算子网络
    branch_dim: 32  # 边界分支特征维度
    trunk_dim: 16  # legacy坐标增强后的主干输入维度；power_fourier模式下自动推导
    coordinate_lift_mode: power_fourier
    coordinate_lift_max_power: 2
    adjust_hidden_dim: 64  # 边界调整网络隐藏层宽度
    branch_hidden_dim: 64  # 边界分支隐藏层宽度
    trunk_hidden_dim: 64  # 坐标主干隐藏层宽度
    adjust_hidden_layer_num: 4  # 边界调整网络隐藏层数
    branch_hidden_layer_num: 4  # 边界分支隐藏层数
    trunk_hidden_layer_num: 4  # 坐标主干隐藏层数
    output_dim: 64  # 融合特征维度
    branch_mlp_hidden_dim: 64  # 三轴联合几何特征融合MLP隐藏层宽度，与二维HMONet一致
    branch_mlp_hidden_layer_num: 4  # 三轴联合几何特征融合MLP隐藏层数，与二维HMONet一致
  pimeshonet:  # 论文PI-MeshONet网络结构
    architecture: paper_modified_mlp  # 三坐标分支与共享Lift/Modified MLP主干
    coordinate_lift_mode: paper  # 论文Lift-Layer向三维的逐轴推广
    coordinate_lift_q: 6  # 三维Lift维度6+3q=24
    branch_dim: 40  # Adjust Layer输出维度；与二维正式配置一致
    trunk_dim: 16  # legacy兼容值；paper模式实际维度由q决定
    adjust_hidden_dim: 80  # Adjust Layer隐藏宽度
    adjust_hidden_layer_num: 4  # Adjust Layer隐藏层数
    branch_hidden_dim: 80  # Modified MLP分支隐藏宽度
    branch_hidden_layer_num: 4  # Modified MLP分支门控层数
    trunk_hidden_dim: 80  # Modified MLP主干隐藏宽度
    trunk_hidden_layer_num: 4  # Modified MLP主干门控层数
    output_dim: 80  # 分支与主干点积的潜在维度
  hmonet:  # HMONet模型配置
    hmonet_mapping_mode: corner_corrected_affine  # 正式默认：CCAP；另可选rational_affine、coons_residual
    # 几何系数固定为 Branch Sigmoid × Trunk Sigmoid，不再提供关闭位置调制或Softplus选项。
    boundary_self_attention_enabled: false  # 是否在边界编码器前启用联合自注意力；正式实验默认关闭
    weight_head_mlp_enabled: true  # true默认使用与Location MLP相同宽度、Tanh激活的单隐藏层MLP；false兼容原Linear
    projection_mlp_hidden_dim: 64  # 两侧系数MLP共用的隐藏层宽度（weight_head启用MLP时生效）
    attention_dim: 64  # 边界自注意力特征维度
    attention_heads: 4  # 多头注意力头数
    attention_layers: 2  # 自注意力编码层数
    attention_feedforward_dim: 128  # 注意力层前馈网络宽度
    attention_dropout: 0.0  # 注意力层dropout比例
    residual_regularization_weight: 0.0  # 仅coons_residual使用；0表示关闭

  qghmonet:  # Query--Geometry Gated Hard-Boundary Mesh Operator Network
    hmonet_mapping_mode: corner_corrected_affine
    query_boundary_cross_attention_enabled: true
    boundary_layer_decoder_enabled: true
    decoupled_weight_decoder_enabled: true
    multiscale_boundary_encoder_enabled: true
    cross_attention_heads: 4
    local_boundary_dim: 16
    boundary_layer_width: 0.08

  meshonet:  # 论文式三分支共享融合结构，宽度与二维正式配置一致
    coordinate_lift_mode: paper  # 论文Lift-Layer向三维的逐轴推广
    coordinate_lift_q: 6  # 三维Lift维度6+3q=24
    branch_dim: 40  # Adjust Layer输出维度
    trunk_dim: 16  # legacy兼容值；paper模式实际维度由q决定
    adjust_hidden_dim: 80  # Adjust Layer隐藏宽度
    adjust_hidden_layer_num: 4  # Adjust Layer隐藏层数
    branch_hidden_dim: 80  # Branch网络隐藏宽度
    branch_hidden_layer_num: 4  # Branch网络隐藏层数
    trunk_hidden_dim: 80  # Trunk网络隐藏宽度
    trunk_hidden_layer_num: 4  # Trunk网络隐藏层数
    output_dim: 80  # 分支和主干点积的潜在维度
    shared_branch_fusion_enabled: true  # 三个分支拼接后是否使用共享融合MLP
    branch_mlp_hidden_dim: 80  # 共享融合MLP隐藏宽度
    branch_mlp_hidden_layer_num: 4  # 共享融合MLP隐藏层数

training:  # 公共训练设置
  dataset: extrapolation  # 与二维正式配置一致，默认训练外推数据集
  num_epochs: 50000  # 最大训练轮数
  # 监督模型默认使用固定网格MSE；PI模型会强制改为自监督训练损失。
  best_model_metric: dataset_mse  # HMONet和MeshONet的最佳模型选择指标
  tensorboard_enabled: true  # 是否启用TensorBoard
  batch_size: 64  # 批大小
  seed: 20261030  # 与二维正式配置一致的随机种子
  device: cuda  # 训练设备
  # [收敛条件1] 固定网格 MSE：监测固定网格误差，可选作为停止条件。
  calculate_dataset_mse: true  # 是否计算固定网格MSE
  dataset_mse_interval: 1  # 固定网格MSE计算间隔
  check_mse_convergence: false  # 是否启用固定网格MSE连续达标的提前停止，默认关闭
  mse_tolerance: 1.0e-6  # MSE收敛阈值
  mse_consecutive_epochs: 100  # MSE连续满足次数

  # [收敛条件2] 训练损失：连续低于阈值时提前停止。
  check_training_loss_convergence: false  # 是否启用训练损失连续达标的提前停止，默认关闭
  training_loss_tolerance: 1.0e-6  # 训练损失收敛阈值
  training_loss_consecutive_epochs: 100  # 训练损失连续满足次数

  # [收敛条件3] 统一成功平台：达到最早epoch后，近最佳、稳定且长期无显著改善时停止。
  plateau_enabled: true  # 是否启用平台收敛判断
  # PI模型会强制使用train_loss，保持自监督训练。
  plateau_metric: mse  # HMONet和MeshONet的平台判断指标
  plateau_window: 500  # 平台统计窗口长度
  fluctuation_quantiles: [0.1, 0.9]  # 窗口波动分位数
  fluctuation_relative_tolerance: 0.15  # 相对波动容差
  fluctuation_absolute_minimum: 1.0e-6  # 绝对波动下限
  fluctuation_absolute_maximum: 1.0e-5  # 绝对波动上限
  plateau_near_best_relative_tolerance: 0.2  # 接近最佳的相对容差
  plateau_near_best_absolute_tolerance: 1.0e-7  # 接近最佳的绝对容差
  best_improvement_relative_tolerance: 0.002  # 显著改善相对阈值（0.2%）

  convergence_start_epoch: 3000  # 所有自动收敛和失败判定开始检查并累计耐心的最早epoch
  success_plateau_patience: 1000  # 无显著改善耐心；只在出现显著改善时归零
  plateau_stable_consecutive_checks: 100  # 短窗口连续稳定次数；满足后可走短窗口收敛分支
  plateau_log_interval: 100  # 平台日志间隔

  # [收敛条件4] 双分支平台：长期波动稳定或短窗口连续稳定，任一分支可触发停止。
  # 第1000轮后允许按相对波动阈值启动，第5000轮强制启动，并要求收集满整个独立窗口。
  plateau_fluctuation_spread_enabled: true  # 是否启用长期波动收敛分支；与短窗口分支为或关系
  plateau_fluctuation_spread_activation: 0.4  # 第1000轮后，相对波动低于此值时启动长期记录
  plateau_fluctuation_spread_start_epoch: 1000  # 允许启动长期记录的最早epoch
  plateau_fluctuation_spread_activation_epoch: 5000  # 无论相对波动大小均强制启动的epoch
  plateau_fluctuation_spread_window: 1000  # 独立设置的长期波动窗口，默认与无显著改善耐心相同
  plateau_fluctuation_spread_quantiles: [0.1, 0.9]  # 计算长期波动差值的低、高分位数
  plateau_fluctuation_spread_tolerance: 0.15  # 高分位数减低分位数的最大允许差值

  # [收敛条件5] 失败平台：与成功判定共用窗口，稳定但明显劣于历史最佳时停止。
  # 它不把失败运行判为正常收敛；保存和评估仍使用训练过程中即时保存的最佳模型。
  failure_plateau_enabled: true  # 是否启用失败平台提前停止
  failure_plateau_patience: 2000  # 连续满足失败平台条件的检查次数；任一条件失败时归零
  failure_plateau_metric_ratio: 1.5  # 近期中位数相对历史最佳窗口中位数的最小失败倍数
  failure_plateau_relative_fluctuation: 0.15  # 失败平台仍需满足的最大相对波动
  failure_plateau_min_lr_updates: 2  # 判断前至少完成的学习率调度次数
  save_best_immediately: true  # 每次刷新最佳指标时立即原子保存最佳模型
  stop_file_enabled: true  # 是否允许在训练或checkpoint目录放置STOP文件安全停止


  # [数值稳定性] 梯度裁剪与非有限值处理。
  gradient_clip_norm: 1.0  # 梯度裁剪上限
  skip_nonfinite_loss: true  # 是否跳过非有限损失

hmonet_training: &hard_operator_training
  # HMONet按自监督总损失选模和判断平台；MeshONet仍按监督MSE选模。
  best_model_metric: training_loss
  plateau_metric: train_loss

  learning_rate: 0.0004  # 与二维正式配置一致
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限

  # 与二维一样从头进行纯物理自监督训练，不读取PDE网格坐标作为监督目标。
  training_strategy: random_loss_combo_from_start
  random_loss_sample_count: 400
  pde_fd_step: [0.01, 0.01, 0.01]
  random_loss_derivative_backend: finite_difference
  random_loss_fd_stencil_inside: true
  random_loss_fd_boundary_scheme: central

  # L = L_PDE,norm + 0.01 L_J,norm + 0.05 L_sigma,norm。
  physics_pde_loss_weight: 1.0
  physics_scale_invariant_pde_enabled: true
  physics_normalized_jacobian_loss_weight: 0.01
  physics_normalized_jacobian_minimum: 0.02
  physics_singular_value_loss_weight: 0.05
  physics_singular_value_minimum: 0.05
  physics_barrier_reduction: all

  # 200个全局均匀点 + 200个曲率—边界距离自适应点。
  random_loss_sampling_mode: mixed_boundary
  random_loss_global_sample_count: 200
  random_loss_curvature_sample_count: 200
  random_loss_boundary_band_sample_count: 0

hmonet_sampling:  # HMONet采样参数，与二维正式配置保持一致
  mode: adaptive
  fixed_grid_count: 0
  global_random_count: 200
  curvature_adaptive_count: 200
  candidate_multiplier: 10
  curvature_quantile: 0.95
  curvature_power: 1.0
  distance_sigma_min: 0.02
  distance_sigma_max: 0.10
  uniform_probability: 0.05

meshonet_training:
  learning_rate: 0.0004  # 初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限
  alpha: 1.0  # 内部坐标损失权重
  beta: 5.0  # 边界坐标损失权重
  interior_sample_count: 400  # 每批共享内部采样点数

pimeshonet_training:
  learning_rate: 0.0004  # 初始学习率
  lr_warmup_epochs: 1000  # 学习率预热轮数
  lr_update_interval: 1000  # 学习率更新间隔
  lr_decay_gamma: 0.9  # 学习率衰减系数
  lr_stop_below: 1.0e-5  # 学习率停止衰减下限
  pde_loss_weight: 1.0e-4  # 原始PDE损失权重
  boundary_loss_weight: 1.0
  interior_sample_count: 128  # 每批共享内部采样点数
  fd_step: [0.01, 0.01, 0.01]  # PI-MeshONet PDE有限差分步长，分别对应三个计算轴

qghmonet_training: *hard_operator_training








