# 三维参数边界评估配置。命令行覆盖本文件的同名项目。
# 当前登记正式三维默认数据集；生成后可直接评估。

stop_on_error: false
cases:
  swb_a_ext_1_500_11_21_11:
    boundary: sidewall_deformed_block
    parameter: sidewall_amplitude
    values: [0.02, 0.34]
    grid_shape: [11, 21, 11]
  cah_t_ext_1_500_11_21_11:
    boundary: cylindrical_domain_with_airfoil_hole
    parameter: thickness
    values: [0.06, 0.38]
    grid_shape: [11, 21, 11]
  run_e_ext_1_500_41_41_11:
    boundary: rounded_u_notch_extrusion
    parameter: depth
    values: [1.52, 1.55]
    grid_shape: [41, 41, 11]
  teb_b_ext_1_500_11_21_11:
    boundary: tapered_elliptic_bore_block
    parameter: minor_axis_out
    values: [0.08, 0.36]
    grid_shape: [11, 21, 11]
  bad_a_ext_1_500_11_21_11:
    boundary: bent_annular_duct
    parameter: bend_angle_deg
    values: [10, 105]
    grid_shape: [11, 21, 11]
  lad_a_ext_1_500_11_21_11:
    boundary: lobed_annular_duct
    parameter: amplitude
    values: [0.00, 0.20]
    grid_shape: [11, 21, 11]

evaluation:
  default_cases:
    - cah_t_ext_1_500_11_21_11
    - swb_a_ext_1_500_11_21_11
    - run_e_ext_1_500_41_41_11
    - teb_b_ext_1_500_11_21_11
    - bad_a_ext_1_500_11_21_11
    - lad_a_ext_1_500_11_21_11
  methods: [tfi, pde, meshonet, pimeshonet, hmonet, qghmonet]
  # CCAP = Corner-Corrected Affine Projection（角点校正仿射投影）。
  # 另可选 RAP = rational_affine，CR = coons_residual。
  hmonet_mapping_mode: CCAP
  curve_kernel_backend: auto
  inference_batch_size: 1
  # none = no external boundary postprocessing; the unmodified model output
  # is stored once in each method's raw/ directory.
  hmonet_boundary_projection: none
  qghmonet_boundary_projection: none
  meshonet_boundary_projection: none
  pimeshonet_boundary_projection: none
  inverse_distance_power: 2.0
  winslow_max_iter: 1000
  winslow_tolerance: 1.0e-6
  device: auto
  inference_warmup_runs: 3
  inference_timing_repeats: 10
  query_batch_size: 65536
  output_root: outputs/results
  reuse_generation_cache: true
  reuse_analysis_cache: true
  force_regenerate: false
  force_reanalyze: false
  compute_grid_quality: true
  quality_metrics: both
  middle_sections: all  # all、none，或 [x_mid, y_mid, z_mid] 的任意子集
  quality_plot_metrics: []
  save_plots: true
  save_png: true
  compact_outputs: true
  save_pdf: false
  save_distribution_plots: false
  zoom_views: []
  skip_missing_checkpoints: true
  require_pde_convergence: true
  hmonet_checkpoint: null
  qghmonet_checkpoint: null
  meshonet_checkpoint: null
  pimeshonet_checkpoint: null
  hmonet_pde_iterations: 0
  generation_only: false
  analysis_only: false
