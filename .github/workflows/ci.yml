name: continuous-integration

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU PyTorch
        run: >-
          python -m pip install
          torch==2.5.1 torchvision==0.20.1
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check command-line entry points
        run: |
          python scripts/experiments/run.py --help
          python scripts/train/train_2d.py --help
          python scripts/train/train_3d.py --help
          python scripts/evaluate/evaluate_2d.py --help
          python scripts/evaluate/evaluate_3d.py --help

      - name: Run test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest tests -q

