# 实验9：尺度归一化PDE + 归一化Jacobian下界 + 最小奇异值下界。
schema_version: 1
experiment: e9_norm_pde_jac_svd

baseline_config: ../baseline/experiment.yaml
evaluation_config: ../baseline/evaluate.yaml

variants:
  - name: e9_norm_pde_jac_svd
    value: normalized_pde_jacobian_singular_value
    overrides:
      - --lr
      - "0.0008"
      - --hmonet-random-mse-loss-weight
      - "0"
      - --hmonet-physics-pde-loss-weight
      - "1"
      - --hmonet-physics-scale-invariant-pde-enabled
      - --pde-fd-step
      - "0.01"
      - "0.01"
      - --hmonet-physics-jacobian-loss-weight
      - "0"
      - --hmonet-physics-normalized-jacobian-loss-weight
      - "0.01"
      - --hmonet-physics-normalized-jacobian-minimum
      - "0.02"
      - --hmonet-physics-singular-value-loss-weight
      - "0.05"
      - --hmonet-physics-singular-value-minimum
      - "0.05"
      - --hmonet-physics-winslow-loss-weight
      - "0"
      - --hmonet-physics-winslow-jacobian-barrier-weight
      - "0"
      - --best-model-metric
      - training_loss
      - --plateau-metric
      - train_loss
