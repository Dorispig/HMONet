# 实验2：随机400点PDE + 1e-4 Jacobian；最多50,000 epoch。
schema_version: 1
experiment: e2_pde_jac
baseline_config: ../baseline/experiment.yaml
evaluation_config: ../baseline/evaluate.yaml
variants:
  - name: e2_pde_jac
    value: pde_plus_1e-4_jacobian
    overrides:
      - --hmonet-random-mse-loss-weight
      - "0"
      - --hmonet-physics-pde-loss-weight
      - "1"
      - --hmonet-physics-jacobian-loss-weight
      - "0.0001"
      - --best-model-metric
      - training_loss
      - --plateau-metric
      - train_loss
