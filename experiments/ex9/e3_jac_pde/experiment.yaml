# 实验3：随机400点Jacobian + 1e-4非归一化PDE；最多50,000 epoch。
schema_version: 1
experiment: e3_jac_pde
baseline_config: ../baseline/experiment.yaml
evaluation_config: ../baseline/evaluate.yaml
variants:
  - name: e3_jac_pde
    value: jacobian_plus_1e-4_pde
    overrides:
      - --hmonet-random-mse-loss-weight
      - "0"
      - --hmonet-physics-pde-loss-weight
      - "0.0001"
      - --hmonet-physics-jacobian-loss-weight
      - "1"
      - --best-model-metric
      - training_loss
      - --plateau-metric
      - train_loss
