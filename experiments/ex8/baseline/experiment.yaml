# ex8 baseline: complete normalized physics objective.
datasets:
  interpolation: data/raw/2D/air_t_ext_1_500_21_21
  extrapolation: data/raw/2D/air_t_ext_1_500_21_21
grid: {nx: 21, ny: 21}
model:
  name: hmonet
  common: {branch_dim: 32, trunk_dim: 16, coordinate_lift_mode: power_fourier, coordinate_lift_max_power: 2, adjust_hidden_dim: 64, adjust_hidden_layer_num: 4, branch_hidden_dim: 64, branch_hidden_layer_num: 4, trunk_hidden_dim: 64, trunk_hidden_layer_num: 4, output_dim: 64, branch_mlp_hidden_dim: 64, branch_mlp_hidden_layer_num: 4}
  hmonet: {hmonet_mapping_mode: corner_corrected_affine, weight_head_mlp_enabled: true, projection_mlp_hidden_dim: 64, boundary_self_attention_enabled: false, residual_regularization_weight: 0.0}
training:
  dataset: extrapolation
  num_epochs: 50000
  batch_size: 64
  seed: 20261030
  device: cuda
  tensorboard_enabled: true
  calculate_dataset_mse: true
  dataset_mse_interval: 1
  best_model_metric: training_loss
  plateau_enabled: true
  plateau_metric: train_loss
  plateau_window: 500
  plateau_stable_consecutive_checks: 100
  best_improvement_relative_tolerance: 0.002
  convergence_start_epoch: 3000
  success_plateau_patience: 1000
  failure_plateau_enabled: true
  failure_plateau_patience: 2000
  failure_plateau_metric_ratio: 1.5
  failure_plateau_relative_fluctuation: 0.15
  failure_plateau_min_lr_updates: 2
  save_best_immediately: true
  stop_file_enabled: true
  gradient_clip_norm: 1.0
  skip_nonfinite_loss: true
hmonet_training:
  best_model_metric: training_loss
  plateau_metric: train_loss
  learning_rate: 0.0004
  lr_warmup_epochs: 1000
  lr_update_interval: 1000
  lr_decay_gamma: 0.9
  lr_stop_below: 1.0e-5
  training_strategy: random_loss_combo_from_start
  random_loss_sample_count: 400
  random_mse_loss_weight: 0.0
  physics_pde_loss_weight: 1.0
  physics_scale_invariant_pde_enabled: true
  physics_normalized_jacobian_loss_weight: 0.01
  physics_normalized_jacobian_minimum: 0.02
  physics_singular_value_loss_weight: 0.05
  physics_singular_value_minimum: 0.05
  physics_barrier_reduction: all
  pde_fd_step: [0.01, 0.01]
  jacobian_fd_step: 0.01
  random_loss_derivative_backend: finite_difference
  random_loss_fd_stencil_inside: true
  random_loss_fd_boundary_scheme: central
  random_loss_sampling_mode: mixed_boundary
  random_loss_global_sample_count: 200
  random_loss_curvature_sample_count: 200
  random_loss_boundary_band_sample_count: 0
hmonet_sampling:
  mode: adaptive
  fixed_grid_count: 0
  global_random_count: 200
  curvature_adaptive_count: 200
  candidate_multiplier: 10
  curvature_quantile: 0.95
  curvature_power: 1.0
  distance_sigma_min: 0.02
  distance_sigma_max: 0.10
  uniform_probability: 0.05
