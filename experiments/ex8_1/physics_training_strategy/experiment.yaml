# ex8_1：复用 ex8 冻结基线，将 ex8 的五种训练策略统一改为 Coons 残差硬约束。
schema_version: 1
experiment: physics_training_strategy
baseline_config: ../../ex8/baseline/experiment.yaml
evaluation_config: ../../ex8/baseline/evaluate.yaml

variants:
  - name: e1_mse_pde
    value: fixed_400_mse_plus_400_pde_coons_residual
    overrides:
      - --lr
      - "0.0004"
      - --hmonet-mapping-mode
      - coons_residual
      - --hmonet-training-strategy
      - fixed_mse_pde_from_start
      - --hmonet-phase2-max-epochs
      - "100000"
      - --hmonet-fixed-mse-sample-count
      - "400"
      - --hmonet-physics-interior-sample-count
      - "400"
      - --hmonet-physics-pde-loss-weight
      - "0.0001"
      - --no-hmonet-physics-jacobian-enabled

  - name: e2_nojac_then_mse_pde
    value: no_jacobian_supervised_then_fixed_400_mse_plus_400_pde_coons_residual
    overrides:
      - --lr
      - "0.0004"
      - --hmonet-mapping-mode
      - coons_residual
      - --hmonet-training-strategy
      - supervised_then_fixed_mse_pde_from_convergence
      - --hmonet-save-phase-best-checkpoints
      - --no-hmonet-reset-optimizer-on-phase-transition
      - --hmonet-phase1-max-epochs
      - "100000"
      - --hmonet-phase2-max-epochs
      - "100000"
      - --no-jacobian-loss-enabled
      - --hmonet-fixed-mse-sample-count
      - "400"
      - --hmonet-physics-interior-sample-count
      - "400"
      - --hmonet-physics-pde-loss-weight
      - "0.0001"
      - --no-hmonet-physics-jacobian-enabled

  - name: e3_jac_then_mse_pde
    value: jacobian_supervised_then_fixed_400_mse_plus_400_pde_coons_residual
    overrides:
      - --lr
      - "0.0004"
      - --hmonet-mapping-mode
      - coons_residual
      - --hmonet-training-strategy
      - supervised_then_fixed_mse_pde_from_convergence
      - --hmonet-save-phase-best-checkpoints
      - --no-hmonet-reset-optimizer-on-phase-transition
      - --hmonet-phase1-max-epochs
      - "100000"
      - --hmonet-phase2-max-epochs
      - "100000"
      - --jacobian-loss-enabled
      - --hmonet-fixed-mse-sample-count
      - "400"
      - --hmonet-physics-interior-sample-count
      - "400"
      - --hmonet-physics-pde-loss-weight
      - "0.0001"
      - --no-hmonet-physics-jacobian-enabled

  - name: e4_nojac_then_pde
    value: no_jacobian_supervised_then_pde_only_coons_residual
    overrides:
      - --lr
      - "0.0004"
      - --hmonet-mapping-mode
      - coons_residual
      - --hmonet-training-strategy
      - supervised_then_pde_from_convergence
      - --hmonet-save-phase-best-checkpoints
      - --no-hmonet-reset-optimizer-on-phase-transition
      - --hmonet-phase1-max-epochs
      - "100000"
      - --hmonet-phase2-max-epochs
      - "100000"
      - --no-jacobian-loss-enabled
      - --hmonet-physics-pde-loss-weight
      - "1.0"
      - --no-hmonet-physics-jacobian-enabled

  - name: e5_jac_then_pde
    value: jacobian_supervised_then_pde_only_coons_residual
    overrides:
      - --lr
      - "0.0004"
      - --hmonet-mapping-mode
      - coons_residual
      - --hmonet-training-strategy
      - supervised_then_pde_from_convergence
      - --hmonet-save-phase-best-checkpoints
      - --no-hmonet-reset-optimizer-on-phase-transition
      - --jacobian-loss-enabled
      - --hmonet-phase1-max-epochs
      - "100000"
      - --hmonet-phase2-max-epochs
      - "100000"
      - --hmonet-physics-pde-loss-weight
      - "1.0"
      - --no-hmonet-physics-jacobian-enabled
